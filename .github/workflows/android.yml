name: Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["v*", "V*"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write # only used to attach the APK to GitHub Releases

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # GitHub's newer runner images have had IPv6 stalls on downloads; stick to IPv4.
      GRADLE_OPTS: -Djava.net.preferIPv4Stack=true
    defaults:
      run:
        shell: bash
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            name="${GITHUB_REF_NAME#[vV]}"
          else
            name="0.1.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the key from the SIGNING_KEYSTORE_BASE64 secret."
          elif [[ -f signing/voicebubble.p12 ]]; then
            echo "SIGNING_KEYSTORE_PATH=$PWD/signing/voicebubble.p12" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_TYPE=pkcs12" >> "$GITHUB_ENV"
            echo "Signing with the app's own key (android/signing/voicebubble.p12)."
          else
            echo "::warning::No signing key, so this APK uses a throwaway debug key. Each new build will need uninstalling the old one first."
          fi

      # services.gradle.org sometimes stalls from GitHub's runners, which breaks ./gradlew.
      # Fetch the same Gradle version ourselves: Gradle's GitHub mirror first, then their
      # own server, retrying and giving up on stalled transfers rather than hanging.
      - name: Fetch Gradle
        run: |
          v=$(sed -n 's/.*gradle-\(.*\)-bin\.zip/\1/p' gradle/wrapper/gradle-wrapper.properties)
          dest="$RUNNER_TEMP/gradle-dist"
          mkdir -p "$dest"
          ok=""
          for url in \
            "https://github.com/gradle/gradle-distributions/releases/download/v$v/gradle-$v-bin.zip" \
            "https://services.gradle.org/distributions/gradle-$v-bin.zip"; do
            echo "Trying $url"
            if curl -4 -fL --retry 3 --retry-delay 5 --retry-all-errors --connect-timeout 20 \
                 --speed-limit 1024 --speed-time 30 -o "$dest/gradle.zip" "$url"; then
              ok="$url"
              break
            fi
          done
          if [[ -z "$ok" ]]; then
            echo "::error::Couldn't download Gradle $v from GitHub or services.gradle.org. Re-run the job in a few minutes."
            exit 1
          fi
          sum=""
          for s in "$ok.sha256" "https://services.gradle.org/distributions/gradle-$v-bin.zip.sha256"; do
            if sum=$(curl -fsSL --retry 2 --max-time 30 "$s" | tr -d '[:space:]') && [[ ${#sum} -eq 64 ]]; then break; fi
            sum=""
          done
          if [[ -n "$sum" ]]; then
            echo "$sum  $dest/gradle.zip" | sha256sum -c -
          else
            echo "::warning::No checksum available; using Gradle $v as downloaded from $ok."
          fi
          unzip -q "$dest/gradle.zip" -d "$dest"
          echo "GRADLE_BIN=$dest/gradle-$v/bin/gradle" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          # Your own key's secrets if you've added them; otherwise the app's own key,
          # whose password is the APP_TOKEN secret.
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD || secrets.APP_TOKEN }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || 'voicebubble' }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || secrets.SIGNING_STORE_PASSWORD || secrets.APP_TOKEN }}
        run: |
          "$GRADLE_BIN" --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/VoiceBubble-$VERSION_NAME.apk"
          echo "APK_PATH=$RUNNER_TEMP/VoiceBubble-$VERSION_NAME.apk" >> "$GITHUB_ENV"

      - name: Signing certificate
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)apksigner"
          "$apksigner" verify --print-certs "$APK_PATH" | grep -E "certificate (DN|SHA-256)" || true

      - name: Remove key file
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceBubble-${{ env.VERSION_NAME }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      # Every build from main replaces the APK on one release, so this link always gets
      # the newest version: https://github.com/<you>/voicebubble/releases/latest/download/VoiceBubble.apk
      - name: Publish newest build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$APK_PATH" "$RUNNER_TEMP/VoiceBubble.apk"
          link="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/VoiceBubble.apk"
          notes="Newest build ($VERSION_NAME). On your phone, open $link in Chrome to download it, then open the file to install or update."
          if gh release view latest-build > /dev/null 2>&1; then
            gh release upload latest-build "$RUNNER_TEMP/VoiceBubble.apk" --clobber
            gh release edit latest-build --title "VoiceBubble $VERSION_NAME" --notes "$notes" --latest
          else
            gh release create latest-build "$RUNNER_TEMP/VoiceBubble.apk" --target "$GITHUB_SHA" \
              --title "VoiceBubble $VERSION_NAME" --notes "$notes" --latest
          fi
          echo "### Download on your phone" >> "$GITHUB_STEP_SUMMARY"
          echo "$link" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release (v* tags only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Works whether the release was made on github.com first or only the tag was pushed.
          # --latest=false keeps the "newest build" link above pointing at builds from main.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK_PATH" --clobber
            gh release edit "$GITHUB_REF_NAME" --latest=false
          else
            gh release create "$GITHUB_REF_NAME" "$APK_PATH" --latest=false \
              --title "VoiceBubble $VERSION_NAME" \
              --notes "Download the APK below on your phone and open it to install or update."
          fi
