name: Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write # only used to attach the APK to a GitHub Release on v* tags

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="0.1.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with your release key."
          else
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret, so this APK uses a throwaway debug key. Each new build will need uninstalling the old one first. See README, step 2."
          fi

      - name: Build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/VoiceBubble-$VERSION_NAME.apk"
          echo "APK_PATH=$RUNNER_TEMP/VoiceBubble-$VERSION_NAME.apk" >> "$GITHUB_ENV"

      - name: Remove key file
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceBubble-${{ env.VERSION_NAME }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Publish release (v* tags only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Works whether the release was made on github.com first or only the tag was pushed.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK_PATH" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK_PATH" \
              --title "VoiceBubble $VERSION_NAME" \
              --notes "Download the APK below on your phone and open it to install or update."
          fi
